---
apiVersion: v1
kind: Service
metadata:
  name: parliament
  namespace: malcolm
spec:
  type: ClusterIP
  ports:
    - port: 8008
      protocol: TCP
      name: http
  selector:
    app: parliament

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parliament-deployment
  namespace: malcolm
  labels:
    app: parliament
    role: service
spec:
  selector:
    matchLabels:
      app: parliament
  replicas: 1
  template:
    metadata:
      labels:
        app: parliament
        role: service
    spec:
      containers:
      - name: parliament-container
        image: ghcr.io/idaholab/malcolm/arkime:26.09.0
        imagePullPolicy: Always
        stdin: false
        tty: true
        ports:
          - name: http
            protocol: TCP
            containerPort: 8008
        envFrom:
          - configMapRef:
              name: process-env
          - configMapRef:
              name: ssl-env
          - configMapRef:
              name: opensearch-env
          - configMapRef:
              name: upload-common-env
          - configMapRef:
              name: auth-common-env
          - configMapRef:
              name: arkime-env
          - secretRef:
              name: arkime-secret-env
        env:
          # the arkime image runs parliament rather than capture/viewer/WISE
          - name: ARKIME_PARLIAMENT
            value: "true"
          - name: ARKIME_PCAP_PROCESSOR
            value: "false"
          - name: VIEWER
            value: "off"
          - name: WISE
            value: "off"
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/container_health.sh
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 10
        volumeMounts:
          - mountPath: /var/local/ca-trust/configmap
            name: parliament-var-local-catrust-volume
          - mountPath: /var/local/curlrc/secretmap
            name: parliament-opensearch-curlrc-secret-volume
      terminationGracePeriodSeconds: 15
      volumes:
        - name: parliament-var-local-catrust-volume
          configMap:
            name: var-local-catrust
        - name: parliament-opensearch-curlrc-secret-volume
          secret:
            secretName: opensearch-curlrc
