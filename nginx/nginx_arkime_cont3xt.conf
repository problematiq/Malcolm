# Arkime Cont3xt (https://arkime.com/cont3xt), served from a separate container running the
#   Arkime image in "cont3xt" mode. Only included if ARKIME_CONT3XT_ENABLED is true (see
#   nginx/scripts/docker_entrypoint.sh, which also generates the "cont3xt" upstream).
#   Cont3xt's webBasePath must be /cont3xt/ (the default in arkime/etc/cont3xt.ini).
location /cont3xt {
    include /etc/nginx/nginx_auth_rt.conf;
    proxy_pass $arkime_protocol://cont3xt;
    proxy_redirect off;
    proxy_set_header Authorization "";
    include /etc/nginx/nginx_proxy_forward_headers.conf;
}
