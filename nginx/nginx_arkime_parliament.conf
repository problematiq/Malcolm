# Arkime Parliament (https://arkime.com/parliament), served from a separate container running
#   the Arkime image in "parliament" mode. Only included if ARKIME_PARLIAMENT_ENABLED is true
#   (see nginx/scripts/docker_entrypoint.sh, which also generates the "parliament" upstream).
#   Parliament's webBasePath must be /parliament/ (the default in arkime/etc/parliament.ini).
location /parliament {
    include /etc/nginx/nginx_auth_rt.conf;
    proxy_pass $arkime_protocol://parliament;
    proxy_redirect off;
    proxy_set_header Authorization "";
    include /etc/nginx/nginx_proxy_forward_headers.conf;
}
