# Arkime Cont3xt config file
#   This file is a template: at container startup (when the container is run in "cont3xt"
#   mode) it is copied to $ARKIME_DIR/etc/cont3xt.ini (unless that file already exists,
#   e.g., if provided via a bind mount or Kubernetes configMap) and its values are filled in
#   from environment variables by docker_entrypoint.sh.
# See https://arkime.com/cont3xt
#     https://github.com/arkime/arkime/blob/main/release/cont3xt.ini.sample
#
# Any setting may also be overridden by Arkime itself at runtime with an environment variable
#   of the form ARKIME_cont3xt__settingName (e.g., ARKIME_cont3xt__authMode=digest).
# Integration API keys (VirusTotal, Shodan, etc.) are usually set per-user in the Cont3xt
#   UI, or can be supplied in an additional file referenced by ARKIME_CONFIG_INCLUDES.

[cont3xt]
elasticsearch=https://opensearch:9200
usersElasticsearch=https://opensearch:9200
port=3218
cont3xtHost=0.0.0.0
# Malcolm's NGINX reverse proxy serves Cont3xt at /cont3xt/ (see ARKIME_CONT3XT_ENABLED)
webBasePath=/cont3xt/
passwordSecret=Malcolm
httpRealm=Arkime
certFile=/opt/arkime/etc/viewer.crt
keyFile=/opt/arkime/etc/viewer.key
cacheTimeout=1d
# like the Arkime viewer, Malcolm's NGINX reverse proxy handles authentication
authMode=header
userNameHeader=x-forwarded-user
userAuthIps=::,0.0.0.0/0

# create users (with Arkime's default roles, which include cont3xtUser) the first time they
#   reach Cont3xt through the NGINX proxy, as the Arkime viewer does
[user-auto-create]
userId=vals['x-forwarded-user']
userName=vals['x-forwarded-user']
enabled=true
webEnabled=true
headerAuthEnabled=true

# a cache that survives process restarts (but is local to this container unless
#   /opt/arkime/cont3xt-cache is backed by a persistent volume)
[cache]
type=lmdb
lmdbDir=/opt/arkime/cont3xt-cache

[Threatstream]
cachePolicy=user

[VirusTotal]
cacheTimeout=1w
