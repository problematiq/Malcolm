# Arkime Cont3xt config file
# Settings documentation: https://arkime.com/settings#cont3xt
# See also https://github.com/arkime/arkime/blob/main/release/cont3xt.ini.sample
#
# This file is used as a template by docker_entrypoint.sh, which fills in the
# connection, authentication, and TLS settings at container startup.
#

[cont3xt]
elasticsearch=https://opensearch:9200
passwordSecret=Malcolm
httpRealm=Arkime
cont3xtHost=0.0.0.0
port=3218
webBasePath=/cont3xt/
certFile=/opt/arkime/etc/viewer.crt
keyFile=/opt/arkime/etc/viewer.key
authMode=header
userNameHeader=x-forwarded-user
userAuthIps=::,0.0.0.0/0
cacheTimeout=1d

[cache]
type=lmdb
lmdbDir=/opt/arkime/cont3xt-cache

##### INTEGRATION SETTINGS
# Integration API keys are configured per-user in the Cont3xt "Settings" page.

[Threatstream]
cachePolicy=user

[VirusTotal]
cacheTimeout=1w
