# Arkime Parliament config file
# Settings documentation: https://arkime.com/settings#parliament
# See also https://github.com/arkime/arkime/blob/main/release/parliament.ini.sample
#
# This file is used as a template by docker_entrypoint.sh, which fills in the
# connection, authentication, and TLS settings at container startup.
#

[parliament]
usersElasticsearch=https://opensearch:9200
passwordSecret=Malcolm
httpRealm=Arkime
parliamentHost=0.0.0.0
port=8008
webBasePath=/parliament/
certFile=/opt/arkime/etc/viewer.crt
keyFile=/opt/arkime/etc/viewer.key
authMode=header
userNameHeader=x-forwarded-user
userAuthIps=::,0.0.0.0/0
# parliament configuration is stored in OpenSearch; this file is only used for
#   issues (as parliament.issues.json) and for upgrading legacy parliament.json files
file=/opt/arkime/parliament-data/parliament.json
footerTemplate=_version_ | <a href="https://arkime.com/parliament">arkime.com/parliament</a> | <a href="/">Malc⦿lm 📄</a> | <a href="/arkime/">Arkime 🦉</a>
