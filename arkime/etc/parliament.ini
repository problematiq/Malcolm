# Arkime Parliament config file
#   This file is a template: at container startup (when the container is run in "parliament"
#   mode) it is copied to $ARKIME_DIR/etc/parliament.ini (unless that file already exists,
#   e.g., if provided via a bind mount or Kubernetes configMap) and its values are filled in
#   from environment variables by docker_entrypoint.sh.
# See https://arkime.com/settings#parliament
#     https://github.com/arkime/arkime/blob/main/release/parliament.ini.sample
#
# Any setting may also be overridden by Arkime itself at runtime with an environment variable
#   of the form ARKIME_parliament__settingName (e.g., ARKIME_parliament__authMode=digest).

[parliament]
# where Parliament stores its cluster definitions (issues are stored alongside it)
file=/opt/arkime/parliament-data/parliament.json
port=8008
parliamentHost=0.0.0.0
# Malcolm's NGINX reverse proxy serves Parliament at /parliament/ (see ARKIME_PARLIAMENT_ENABLED)
webBasePath=/parliament/
usersElasticsearch=https://opensearch:9200
passwordSecret=Malcolm
httpRealm=Arkime
certFile=/opt/arkime/etc/viewer.crt
keyFile=/opt/arkime/etc/viewer.key
# like the Arkime viewer, Malcolm's NGINX reverse proxy handles authentication
authMode=header
userNameHeader=x-forwarded-user
userAuthIps=::,0.0.0.0/0

# create users (with Arkime's default roles, which include parliamentUser) the first time they
#   reach Parliament through the NGINX proxy, as the Arkime viewer does
[user-auto-create]
userId=vals['x-forwarded-user']
userName=vals['x-forwarded-user']
enabled=true
webEnabled=true
headerAuthEnabled=true
